# miConnect production: Cloudflare proxy -> this Nginx (:5679) -> rails (127.0.0.1:5680)
#
# Install:  cp deployment/vps/nginx/miconnect.conf /etc/nginx/sites-available/miconnect.conf
#           ln -s /etc/nginx/sites-available/miconnect.conf /etc/nginx/sites-enabled/
# Requires: /etc/nginx/conf.d/cloudflare-realip.conf (written by cloudflare-firewall.sh)
#           Cloudflare Origin Certificate in /etc/ssl/cloudflare/
#
# Only Cloudflare IPs can reach :5679 (ufw rules from cloudflare-firewall.sh).

upstream miconnect_backend {
  zone miconnect_upstream 64K;
  server 127.0.0.1:5680;
  keepalive 32;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Reject TLS for any hostname other than miconnect.vn (scanners hitting the IP).
server {
  listen 5679 ssl default_server;
  listen [::]:5679 ssl default_server;
  ssl_reject_handshake on;
}

server {
  # "listen ... http2" form: Ubuntu 24.04 ships Nginx 1.24 (no "http2 on;").
  listen 5679 ssl http2;
  listen [::]:5679 ssl http2;
  server_name miconnect.vn;

  server_tokens off;
  underscores_in_headers on;

  access_log /var/log/nginx/miconnect_access.log;
  error_log  /var/log/nginx/miconnect_error.log;

  # Cloudflare Origin Certificate (SSL/TLS > Origin Server). Mode: Full (strict).
  ssl_certificate     /etc/ssl/cloudflare/miconnect.vn.pem;
  ssl_certificate_key /etc/ssl/cloudflare/miconnect.vn.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:miconnect_ssl:10m;
  ssl_session_timeout 1d;

  add_header Strict-Transport-Security "max-age=31536000" always;

  location / {
    proxy_pass http://miconnect_backend;
    proxy_redirect off;

    proxy_pass_header Authorization;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Ssl on;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # ActionCable websockets (realtime chat)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Cloudflare free plan caps request bodies at 100MB anyway.
    client_max_body_size 100m;
    proxy_read_timeout 36000s;
  }
}
