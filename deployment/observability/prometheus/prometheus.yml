global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: node
    static_configs: [{ targets: ["node-exporter:9100"] }]
  - job_name: cadvisor
    static_configs: [{ targets: ["cadvisor:8080"] }]
  - job_name: redis
    static_configs: [{ targets: ["redis-exporter:9121"] }]
  - job_name: loki
    static_configs: [{ targets: ["loki:3100"] }]
  - job_name: alloy
    static_configs: [{ targets: ["alloy:12345"] }]
  - job_name: grafana
    static_configs: [{ targets: ["grafana:3000"] }]
  # Giám sát từ bên ngoài: VPS này kiểm tra dịch vụ của VPS PBX (không cần VPS thứ 3).
  - job_name: blackbox-http
    metrics_path: /probe
    params: {module: [http_2xx]}
    static_configs: [{targets: ['https://td1.tekomi.vn/']}]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  # Giám sát từ bên ngoài: VPS này kiểm tra dịch vụ của VPS PBX (không cần VPS thứ 3).
  # Chatwoot/Sidekiq hiện KHÔNG có endpoint /metrics (không có gem prometheus/yabeda).
  # Số liệu Sidekiq lấy qua redis-exporter (độ dài queue), request/lỗi lấy từ log (lograge).
