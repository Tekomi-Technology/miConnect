global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: node
    static_configs: [{ targets: ["node-exporter:9100"] }]
  - job_name: cadvisor
    static_configs: [{ targets: ["cadvisor:8080"] }]
  - job_name: redis
    static_configs: [{ targets: ["redis-exporter:9121"] }]
  - job_name: loki
    static_configs: [{ targets: ["loki:3100"] }]
  - job_name: alloy
    static_configs: [{ targets: ["alloy:12345"] }]
  - job_name: grafana
    static_configs: [{ targets: ["grafana:3000"] }]
  # Chatwoot/Sidekiq hiện KHÔNG có endpoint /metrics (không có gem prometheus/yabeda).
  # Số liệu Sidekiq lấy qua redis-exporter (độ dài queue), request/lỗi lấy từ log (lograge).
