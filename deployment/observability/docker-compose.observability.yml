# Stack observability cho Chatwoot: Grafana + Loki + Prometheus + Alloy + exporters.
# Chạy: docker compose -f docker-compose.observability.yml --env-file .env up -d
name: observability

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    mem_limit: 160m
    cpus: 0.5
    logging: *logging
    ports:
      - "${GRAFANA_BIND_ADDR:-127.0.0.1}:${GRAFANA_PORT:-3300}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?đặt GRAFANA_ADMIN_PASSWORD trong .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3300/}
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_ALERTING_ENABLED: "false"
      GOMEMLIMIT: 130MiB
      # Telegram: để trống thì dùng giá trị giả, contact point vẫn load được nhưng gửi sẽ lỗi (chỉ log).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-disabled}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-not-set}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [loki, prometheus]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    mem_limit: 160m
    cpus: 0.5
    logging: *logging
    command: ["-config.file=/etc/loki/loki-config.yml", "-config.expand-env=true"]
    environment:
      GOMEMLIMIT: 130MiB
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    mem_limit: 160m
    cpus: 0.5
    logging: *logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=10d
      - --storage.tsdb.retention.size=1GB
      - --web.enable-lifecycle
    environment:
      GOMEMLIMIT: 130MiB
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready | grep -qi ready"]
      interval: 30s
      timeout: 5s
      retries: 5

  alloy:
    image: grafana/alloy:v1.7.1
    restart: unless-stopped
    mem_limit: 80m
    cpus: 0.3
    logging: *logging
    user: "0:0"   # cần đọc /var/run/docker.sock (mount read-only, chỉ dùng để discovery + đọc log)
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
    environment:
      GOMEMLIMIT: 64MiB
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]

  blackbox:
    image: prom/blackbox-exporter:v0.26.0
    restart: unless-stopped
    mem_limit: 32m
    cpus: 0.2
    logging: *logging
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro

  node-exporter:
    image: prom/node-exporter:v1.9.0
    restart: unless-stopped
    mem_limit: 24m
    cpus: 0.2
    logging: *logging
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/containers/.+)($$|/)
      - --no-collector.ipvs
      - --no-collector.nfs
      - --no-collector.nfsd
    environment:
      GOMEMLIMIT: 20MiB
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    restart: unless-stopped
    mem_limit: 80m
    cpus: 0.3
    logging: *logging
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project
      - --disable_metrics=percpu,sched,tcp,udp,advtcp,hugetlb,referenced_memory,cpu_topology,resctrl,process,disk,diskIO
    environment:
      GOMEMLIMIT: 64MiB
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/lib/containerd:/var/lib/containerd:ro
      - /etc/machine-id:/etc/machine-id:ro

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0-alpine
    restart: unless-stopped
    mem_limit: 24m
    cpus: 0.2
    logging: *logging
    environment:
      REDIS_ADDR: ${REDIS_ADDR:-redis://redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Độ dài các list queue của Sidekiq + zset retry/dead/schedule
      REDIS_EXPORTER_CHECK_KEYS: "queue:*,retry,dead,schedule"
      GOMEMLIMIT: 20MiB
    networks: [default, chatwoot]

volumes:
  grafana_data:
  loki_data:
  prometheus_data:
  alloy_data:

networks:
  chatwoot:
    external: true
    name: ${CHATWOOT_NETWORK:-chatwoot_default}
