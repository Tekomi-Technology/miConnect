# Tempo single-binary, lưu local, giữ trace 3 ngày. Nhận OTLP gRPC 4317 / HTTP 4318 (chỉ trong docker network).
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 10m
  trace_idle_period: 10s

compactor:
  compaction:
    block_retention: 72h        # 3 ngày

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    ingestion:
      rate_limit_bytes: 5000000
      burst_size_bytes: 10000000
      max_traces_per_user: 5000
