apiVersion: 1
contactPoints:
  - orgId: 1
    name: telegram
    receivers:
      - uid: telegram-main
        type: telegram
        disableResolveMessage: false
        settings:
          bottoken: $TELEGRAM_BOT_TOKEN
          chatid: $TELEGRAM_CHAT_ID  # LUU Y: chat id am (group) bi YAML doc thanh so -> ghi thang chuoi "-123..." vao file tren server
policies:
  - orgId: 1
    receiver: telegram
    group_by: ["alertname"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
